name: LAT-CES Windows Installer

# Persistent operational memory: docs/WORKFLOW-RUNBOOK.md
# Release rule: exact commit -> verification GREEN -> EXE smoke -> GUI acceptance -> installer smoke -> artifact evidence.
# Never report an EXE/installer as ready from an older commit.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.10'

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package and build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pyinstaller

      - name: Verify complete desktop application imports
        shell: pwsh
        run: |
          python -c "from lat_ces.gui_complete import CompleteBuildingWorkspaceApp; print('LAT-CES complete Building workspace import OK')"
          python -c "from lat_ces.gui_launcher import CompleteBuildingWorkspaceApp; print('LAT-CES GUI launcher import OK')"
          python -c "from lat_ces.gui_dashboard import ProjectOverviewApp; print('LAT-CES project overview import OK')"
          python -c "from lat_ces.gui_product_dashboard import ProductBuildingWorkspaceApp; print('LAT-CES product binding workspace import OK')"
          python -c "from lat_ces.gui_product_engineering_dashboard import ProductEngineeringWorkspaceApp; print('LAT-CES product engineering workspace import OK')"
          pytest -q

      - name: Build GUI executable
        shell: pwsh
        run: |
          $pyinstallerArgs = @(
            '--noconfirm',
            '--clean',
            '--onefile',
            '--windowed',
            '--name',
            'LATSES',
            'lat_ces/gui_product_engineering_dashboard.py',
            '--add-data',
            'lat_ces/reference_house_model.json;lat_ces'
          )
          & pyinstaller @pyinstallerArgs
          if (!(Test-Path '.\dist\LATSES.exe')) { throw 'LATSES.exe was not created' }
          if ((Get-Item '.\dist\LATSES.exe').Length -lt 1000000) { throw 'LATSES.exe is unexpectedly small' }

      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\dist\LATSES.exe' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 3
          if ($p.HasExited -and $p.ExitCode -ne 0) { throw "LATSES.exe exited with code $($p.ExitCode)" }
          if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }

      - name: Build console acceptance diagnostic executable
        shell: pwsh
        run: |
          $pyinstallerArgs = @(
            '--noconfirm',
            '--clean',
            '--onefile',
            '--console',
            '--name',
            'LATCES-Acceptance-Diagnostic',
            'lat_ces/gui_product_engineering_dashboard.py',
            '--add-data',
            'lat_ces/reference_house_model.json;lat_ces'
          )
          & pyinstaller @pyinstallerArgs
          if (!(Test-Path '.\dist\LATCES-Acceptance-Diagnostic.exe')) { throw 'LATCES-Acceptance-Diagnostic.exe was not created' }

      - name: GUI visual acceptance sequence
        shell: pwsh
        run: |
          $env:LATCES_GUI_ACCEPTANCE = '1'
          $log = Join-Path $env:GITHUB_WORKSPACE 'acceptance.log'
          $err = Join-Path $env:GITHUB_WORKSPACE 'acceptance-error.log'
          Remove-Item $log,$err -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath '.\dist\LATCES-Acceptance-Diagnostic.exe' -PassThru -WindowStyle Hidden -RedirectStandardOutput $log -RedirectStandardError $err
          $deadline = (Get-Date).AddSeconds(90)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Milliseconds 500
          }
          Write-Host '--- ACCEPTANCE DIAGNOSTIC STDOUT ---'
          if (Test-Path $log) { Get-Content $log }
          Write-Host '--- ACCEPTANCE DIAGNOSTIC STDERR ---'
          if (Test-Path $err) { Get-Content $err }
          Write-Host '--- END ACCEPTANCE DIAGNOSTIC LOG ---'
          if (-not $p.HasExited) {
            Stop-Process -Id $p.Id -Force
            throw 'GUI visual acceptance timed out after 90 seconds'
          }
          if ($p.ExitCode -ne 0) { throw "GUI visual acceptance failed with exit code $($p.ExitCode)" }

      - name: Upload acceptance diagnostic log
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: LAT-CES-GUI-Acceptance-Diagnostic
          path: |
            acceptance.log
            acceptance-error.log
          if-no-files-found: warn

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build standard Windows installer
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($iscc) { $isccPath = $iscc.Source }
          if (-not $isccPath) {
            $candidates = @(
              "$env:ChocolateyToolsLocation\innosetup\tools\ISCC.exe",
              "$env:ChocolateyInstall\bin\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            )
            $isccPath = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }
          if (-not $isccPath) {
            $isccPath = Get-ChildItem 'C:\ProgramData\chocolatey\lib\innosetup' -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $isccPath) { throw 'Inno Setup compiler ISCC.exe not found' }
          & $isccPath 'installer\LATSES.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path '.\installer-output\LAT-CES-Setup.exe')) {
            if (Test-Path '.\installer\installer-output\LAT-CES-Setup.exe') {
              New-Item -ItemType Directory -Force -Path 'installer-output' | Out-Null
              Copy-Item '.\installer\installer-output\LAT-CES-Setup.exe' '.\installer-output\LAT-CES-Setup.exe'
            } else { throw 'LAT-CES-Setup.exe was not created' }
          }

      - name: Smoke test installer artifact
        shell: pwsh
        run: |
          $size = (Get-Item '.\installer-output\LAT-CES-Setup.exe').Length
          if ($size -lt 1000000) { throw "Installer unexpectedly small: $size bytes" }
          Get-FileHash '.\installer-output\LAT-CES-Setup.exe' -Algorithm SHA256 | Format-List

      - name: Upload standard installer
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: LAT-CES-Windows-Installer
          path: installer-output/LAT-CES-Setup.exe
          if-no-files-found: error
