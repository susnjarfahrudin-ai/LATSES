name: LATSES Windows Executable

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.10'

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pyinstaller

      - name: Verify master GUI source
        shell: pwsh
        run: |
          python -c "from lat_ces.gui_master import MasterBuildingWorkspaceApp; print('LAT-CES master GUI import OK')"
          pytest -q tests/test_building_engineering_checkpoint.py tests/test_building_engineering_completion.py tests/test_building_engineering_ui.py tests/gui_fullscreen_viewport_smoke_test.py

      - name: Build LATCES.exe from master GUI
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name LATSES `
            --add-data "lat_ces/materials/building_materials.catalog.json;lat_ces/materials" `
            --add-data "lat_ces/reference_house_model.json;lat_ces" `
            lat_ces/gui_master.py
          if (!(Test-Path '.\dist\LATSES.exe')) { throw 'LATSES.exe was not created' }
          if ((Get-Item '.\dist\LATSES.exe').Length -lt 1000000) { throw 'LATSES.exe is unexpectedly small' }

      - name: Smoke test GUI executable
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\dist\LATSES.exe' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          if ($p.HasExited -and $p.ExitCode -ne 0) { throw "LATSES.exe exited with code $($p.ExitCode)" }
          if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }

      - name: Package GUI executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item .\dist\LATSES.exe .\release\LATSES.exe
          $readme = @(
            'LATSES Windows GUI package',
            '',
            'LATSES.exe is the master Building Engineering desktop application.',
            'It is built from lat_ces/gui_master.py and uses the canonical BuildingModel workspace.',
            '',
            'Reference House, Tlocrt, Presjek, 3D, Provjera and Engineering Report are exposed by the master GUI.'
          )
          $readme | Set-Content -Encoding UTF8 .\release\README-WINDOWS.txt
          Get-FileHash .\release\LATSES.exe -Algorithm SHA256 | Format-List

      - name: Upload LATSES GUI package
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: LATSES-Windows-GUI-x64
          path: release/*
          if-no-files-found: error
          retention-days: 30
