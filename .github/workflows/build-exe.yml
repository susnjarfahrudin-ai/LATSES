name: LATSES Windows Executable

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.10'

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install package and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pyinstaller

      - name: SCI acceptance gate before EXE build
        shell: pwsh
        run: |
          python tools/validate_sci_acceptance.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pytest -q tests/scientific/test_sci145_contract.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build LATSES.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name LATSES lat_ces/cli.py

      - name: Smoke test executable
        shell: pwsh
        run: |
          & .\dist\LATSES.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package executable and Windows launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item .\dist\LATSES.exe .\release\LATSES.exe
          $launcher = @(
            '@echo off',
            'setlocal',
            'cd /d "%~dp0"',
            'if not exist "LATSES.exe" (',
            '  echo ERROR: LATSES.exe nije pronadjen.',
            '  pause',
            '  exit /b 1',
            ')',
            'echo.',
            'echo LATSES Scientific Core',
            'echo =====================',
            'echo.',
            'echo Za pomoc:',
            'echo   LATSES.exe --help',
            'echo.',
            'echo Za analizu:',
            'echo   LATSES.exe analyze -c examples\plenum_north_config.json -o report.json -f json',
            'echo.',
            'echo Prozor ostaje otvoren nakon zavrsetka.',
            'echo.',
            'cmd /k "LATSES.exe --help"'
          )
          $launcher | Set-Content -Encoding ASCII .\release\START-LATSES.bat
          $readme = @(
            'LATSES Windows package',
            '',
            '1. Pokreni START-LATSES.bat za korisnicki pokretac.',
            '2. Ili iz Command Prompt-a pokreni LATSES.exe --help.',
            '3. Za naučnu analizu koristi:',
            '   LATSES.exe analyze -c examples\plenum_north_config.json -o report.json -f json',
            '',
            'Napomena: LATSES.exe je konzolni (CLI) alat, nije graficki GUI installer.'
          )
          $readme | Set-Content -Encoding UTF8 .\release\README-WINDOWS.txt
          Get-FileHash .\release\LATSES.exe -Algorithm SHA256 | Format-List

      - name: Upload LATSES Windows package
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: LATSES-Windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 30
