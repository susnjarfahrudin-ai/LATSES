name: LAT-CES Verification Pipeline

# Persistent operational runbook: docs/WORKFLOW-RUNBOOK.md
# Read it before repairing CI or declaring a release GREEN.
# Release memory: inspect the exact commit -> first real failure -> smallest canonical fix -> rerun -> GREEN -> package.

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, 'consolidation/**', 'integration/**' ]
  pull_request:
    branches: [ main, 'integration/**' ]

jobs:
  verify-core:
    runs-on: ubuntu-latest

    steps:
    - name: Preuzimanje koda (Checkout)
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26

    - name: Podešavanje Python okruženja
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
      with:
        python-version: '3.10'

    - name: Instalacija projekta i zavisnosti
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest build

    - name: Provjera wheel package discovery
      run: |
        python -m build --wheel --outdir wheel-dist
        python - <<'PY'
        from pathlib import Path
        from zipfile import ZipFile
        wheel = next(Path("wheel-dist").glob("*.whl"))
        with ZipFile(wheel) as archive:
            names = set(archive.namelist())
        required = {
            "lat_ces/cli.py",
            "lat_ces/application/service.py",
            "lat_ces/scientific/cli.py",
            "lat_ces/scientific/analysis/plenum.py",
            "lat_ces/scientific/reports/exporter.py",
            "lat_ces/gui.py",
            "lat_ces/scientific/core/ontology.py",
            "lat_ces/scientific/core/reasoning.py",
            "lat_ces/scientific/core/synthesis.py",
            "lat_ces/scientific/core/governance.py",
            "lat_ces/scientific/core/building_adapter.py",
        }
        missing = sorted(required - names)
        if missing:
            raise SystemExit(f"Wheel is missing expected LAT-CES modules: {missing}")
        print(f"Wheel package discovery OK: {wheel.name}")
        PY

    - name: Forensic raw-byte scan (source / build-lib / wheel)
      run: |
        python - <<'PY'
        from hashlib import sha256
        from pathlib import Path
        from zipfile import ZipFile

        def scan_bytes(label, path, data):
            offsets=[]
            start=0
            while True:
                pos=data.find(b"\\x00", start)
                if pos < 0:
                    break
                offsets.append(pos)
                start=pos+1
            if offsets:
                print(f"NULL-HIT|{label}|PATH={path}|SIZE={len(data)}|OFFSETS={offsets}|SHA256={sha256(data).hexdigest()}")
            return bool(offsets)

        hits=False
        roots=[Path("lat_ces"), Path("build/lib/lat_ces")]
        for root in roots:
            if root.exists():
                for path in sorted(root.rglob("*.py")):
                    data=path.read_bytes()
                    hits |= scan_bytes("source" if root.parts[0]=="lat_ces" else "build/lib", path, data)

        for wheel in sorted(Path("wheel-dist").glob("*.whl")):
            with ZipFile(wheel) as archive:
                for name in sorted(archive.namelist()):
                    if name.endswith(".py"):
                        data=archive.read(name)
                        hits |= scan_bytes("wheel", f"{wheel}!/{name}", data)

        if not hits:
            print("NULL-SCAN-CLEAN|No NUL bytes found in source, build/lib, or wheel Python payloads")
        PY

    - name: SCI 1-145 structural acceptance audit
      run: |
        python tools/validate_sci_acceptance.py

    - name: SCI ontology/reasoning/synthesis/governance contract tests
      run: |
        set -o pipefail
        pytest -q tests/scientific/test_sci145_contract.py 2>&1 | tee sci145-contract-output.log

    - name: Forensic import-source diagnosis
      run: |
        python - <<'PY'
        import hashlib, importlib.util, sys
        from pathlib import Path

        target = "lat_ces.security.process_security"
        spec = importlib.util.find_spec(target)
        print(f"IMPORT-SPEC|name={target}|origin={getattr(spec, 'origin', None)}|loader={type(getattr(spec, 'loader', None)).__name__}")
        print("SYS-PATH")
        for p in sys.path:
            print(f"  {p}")

        origin = Path(spec.origin) if spec and spec.origin else None
        if origin and origin.exists():
            data = origin.read_bytes()
            print(f"ORIGIN-BYTES|PATH={origin}|SIZE={len(data)}|SHA256={hashlib.sha256(data).hexdigest()}|NULL_OFFSETS={[i for i,b in enumerate(data) if b == 0]}")
            compile(data, str(origin), "exec")
            print("ORIGIN-COMPILE-OK")

        if spec and spec.loader and hasattr(spec.loader, "get_source"):
            source = spec.loader.get_source(target)
            raw = source.encode("utf-8") if isinstance(source, str) else source
            print(f"LOADER-SOURCE|TYPE={type(source).__name__}|SIZE={len(raw)}|SHA256={hashlib.sha256(raw).hexdigest()}|NULL_OFFSETS={[i for i,b in enumerate(raw) if b == 0]}")
            compile(source, str(origin), "exec")
            print("LOADER-COMPILE-OK")

        print("FORENSIC-IMPORT-TEST")
        import lat_ces.security.process_security as ps
        print(f"IMPORTED|FILE={ps.__file__}|SHA256={hashlib.sha256(Path(ps.__file__).read_bytes()).hexdigest()}")
        print("FORENSIC-IMPORT-OK")
        PY

    - name: Pokretanje LAT-CES Verifikacijskih Testova (0001 - 0009)
      run: |
        set -o pipefail
        pytest -x -vv --tb=long 2>&1 | tee pytest-output.log

    - name: Objavi detalje prvog failing testa
      if: failure()
      run: |
        {
          echo '## CI failure — prvi failing test'
          echo
          echo 'Read docs/WORKFLOW-RUNBOOK.md before the next repair cycle.'
          echo
          echo '### SCI contract output'
          echo '```text'
          tail -n 120 sci145-contract-output.log || true
          echo '```'
          echo
          echo '### General pytest output'
          echo '```text'
          tail -n 120 pytest-output.log || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

# CI trigger comment: SMC-004 acceptance verification (branch synchronization).
# Scientific contract acceptance is a prerequisite for EXE/installer packaging.
