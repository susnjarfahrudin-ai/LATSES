name: LAT-CES Verification Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, 'consolidation/**', 'integration/**' ]
  pull_request:
    branches: [ main, 'integration/**' ]

jobs:
  forensic-process-security-bytes:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26

    - name: Characterize process_security raw bytes
      run: |
        python - <<'PY'
        from pathlib import Path
        import hashlib
        import codecs

        path = Path("lat_ces/security/process_security.py")
        raw = path.read_bytes()

        print(f"FORENSIC|PATH={path}")
        print(f"FORENSIC|SIZE={len(raw)}")
        print(f"FORENSIC|SHA256={hashlib.sha256(raw).hexdigest()}")
        print("FORENSIC|FIRST_64_BYTES_HEX=" + raw[:64].hex(" "))

        nul = [i for i, b in enumerate(raw) if b == 0]
        ff = [i for i, b in enumerate(raw) if b == 0xFF]
        fe = [i for i, b in enumerate(raw) if b == 0xFE]

        print(f"FORENSIC|NUL_COUNT={len(nul)}")
        print(f"FORENSIC|NUL_OFFSETS={nul}")
        print(f"FORENSIC|FF_COUNT={len(ff)}")
        print(f"FORENSIC|FF_OFFSETS={ff}")
        print(f"FORENSIC|FE_COUNT={len(fe)}")
        print(f"FORENSIC|FE_OFFSETS={fe}")

        for name, enc in (
            ("UTF-8", "utf-8"),
            ("UTF-16LE", "utf-16-le"),
            ("UTF-16BE", "utf-16-be"),
            ("UTF-32LE", "utf-32-le"),
            ("UTF-32BE", "utf-32-be"),
        ):
            try:
                text = raw.decode(enc)
                print(f"FORENSIC|{name}|DECODE=PASS|CHARS={len(text)}")
                print(f"FORENSIC|{name}|HEAD={text[:240]!r}")
                print(f"FORENSIC|{name}|REENCODE_SHA256={hashlib.sha256(text.encode(enc)).hexdigest()}")
            except UnicodeDecodeError as exc:
                print(f"FORENSIC|{name}|DECODE=FAIL|{exc}")

        print("FORENSIC|PYTHON_COMPILE_CHECK")
        compile(raw, str(path), "exec")
        print("FORENSIC|PYTHON_COMPILE=PASS")
        PY
