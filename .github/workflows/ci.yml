name: LAT-CES Verification Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, 'consolidation/**', 'integration/**' ]
  pull_request:
    branches: [ main, 'integration/**' ]

jobs:
  verify-core:
    runs-on: ubuntu-latest

    steps:
    - name: Preuzimanje koda (Checkout)
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26

    - name: Podešavanje Python okruženja
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
      with:
        python-version: '3.10'

    - name: Instalacija projekta i zavisnosti
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest build

    - name: Provjera wheel package discovery
      run: |
        python -m build --wheel --outdir wheel-dist
        python - <<'PY'
        from pathlib import Path
        from zipfile import ZipFile
        wheel = next(Path("wheel-dist").glob("*.whl"))
        with ZipFile(wheel) as archive:
            names = set(archive.namelist())
        required = {
            "lat_ces/cli.py",
            "lat_ces/application/service.py",
            "lat_ces/scientific/cli.py",
            "lat_ces/scientific/analysis/plenum.py",
            "lat_ces/scientific/reports/exporter.py",
            "lat_ces/gui.py",
            "lat_ces/scientific/core/ontology.py",
            "lat_ces/scientific/core/reasoning.py",
            "lat_ces/scientific/core/synthesis.py",
            "lat_ces/scientific/core/governance.py",
            "lat_ces/scientific/core/building_adapter.py",
        }
        missing = sorted(required - names)
        if missing:
            raise SystemExit(f"Wheel is missing expected LAT-CES modules: {missing}")
        print(f"Wheel package discovery OK: {wheel.name}")
        PY

    - name: Forensic characterize secure_ipc raw bytes
      run: |
        python - <<'PY'
        from pathlib import Path
        import hashlib

        path = Path("lat_ces/security/secure_ipc.py")
        raw = path.read_bytes()
        print(f"FORENSIC|PATH={path}")
        print(f"FORENSIC|SIZE={len(raw)}")
        print(f"FORENSIC|SHA256={hashlib.sha256(raw).hexdigest()}")
        print("FORENSIC|FIRST_64_BYTES_HEX=" + raw[:64].hex(" "))
        for label, value in (("NUL", 0), ("FF", 0xFF), ("FE", 0xFE)):
            offsets = [i for i, b in enumerate(raw) if b == value]
            print(f"FORENSIC|{label}_COUNT={len(offsets)}")
            print(f"FORENSIC|{label}_OFFSETS={offsets}")
        for name, enc in (("UTF-8", "utf-8"), ("UTF-16LE", "utf-16-le"), ("UTF-16BE", "utf-16-be"), ("UTF-32LE", "utf-32-le"), ("UTF-32BE", "utf-32-be")):
            try:
                text = raw.decode(enc)
                print(f"FORENSIC|{name}|DECODE=PASS|CHARS={len(text)}")
                print(f"FORENSIC|{name}|HEAD={text[:240]!r}")
                print(f"FORENSIC|{name}|REENCODE_SHA256={hashlib.sha256(text.encode(enc)).hexdigest()}")
            except UnicodeDecodeError as exc:
                print(f"FORENSIC|{name}|DECODE=FAIL|{exc}")
        print("FORENSIC|PYTHON_COMPILE_CHECK")
        compile(raw, str(path), "exec")
        print("FORENSIC|PYTHON_COMPILE=PASS")
        PY
