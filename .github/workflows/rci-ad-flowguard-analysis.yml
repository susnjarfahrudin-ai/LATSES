name: RCI-AD FlowGuard Mathematical Analysis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe-flowguard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run focused RCI-AD bridge tests
        run: python -m pytest -q tests/test_rci_ad_flow_observation.py

      - name: Run one-dimensional five-minute mathematical profile
        run: |
          python - <<'PY'
          import json
          import time
          from pathlib import Path

          from lat_ces.rci_ad.flow_observation import observe_flow
          from lat_ces.security.flow_guard import FlowGuard

          dimensions = ("frequency", "volume", "concurrency", "novelty")
          guard = FlowGuard({name: 100.0 for name in dimensions})
          levels = (0.249, 0.199, 0.149, 0.129)
          duration = 300.0
          sample_period = 1.0
          out = Path("rci-ad-flow-analysis.jsonl")

          with out.open("w", encoding="utf-8") as fh:
              for deviation in levels:
                  target = 100.0 * (1.0 + deviation)
                  started = time.monotonic()
                  samples = 0
                  observed_records = []
                  min_throttle = 1.0
                  max_throttle = 0.0
                  blocked = 0

                  def capture(record):
                      observed_records.append(record)

                  while time.monotonic() - started < duration:
                      observed = {name: 100.0 for name in dimensions}
                      observed["frequency"] = target
                      record = observe_flow(guard, observed, capture)
                      min_throttle = min(min_throttle, record.decision.throttle)
                      max_throttle = max(max_throttle, record.decision.throttle)
                      blocked += int(not record.decision.allowed)
                      samples += 1
                      time.sleep(sample_period)

                  summary = {
                      "dimension": "frequency",
                      "deviation": deviation,
                      "load_percent_of_baseline": (1.0 + deviation) * 100.0,
                      "duration_seconds": duration,
                      "samples": samples,
                      "blocked_samples": blocked,
                      "min_throttle": min_throttle,
                      "max_throttle": max_throttle,
                      "limiting_dimensions": sorted({r.limiting_dimension for r in observed_records}),
                  }
                  fh.write(json.dumps(summary, sort_keys=True) + "\n")
                  print(json.dumps(summary, sort_keys=True))

          print(f"Wrote {out}")
          PY

      - name: Publish mathematical evidence
        uses: actions/upload-artifact@v4
        with:
          name: rci-ad-flowguard-mathematical-analysis
          path: rci-ad-flow-analysis.jsonl
