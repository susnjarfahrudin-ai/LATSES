name: One-shot Reference House room editing patch

on:
  push:
    branches:
      - fix/reference-house-room-editing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Apply room editing patch
        run: python tools/apply_reference_room_editing_patch.py
      - name: Verify syntax and focused tests
        run: |
          python -m py_compile lat_ces/gui_enhanced.py lat_ces/gui_complete.py
          pytest -q tests/building_model/test_building_model_foundation.py tests/test_building_editor_dimensions.py
      - name: Commit patch and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lat_ces/gui_enhanced.py lat_ces/gui_complete.py
          git rm .github/workflows/oneshot-room-editing.yml tools/apply_reference_room_editing_patch.py
          git commit -m "fix(gui): restore interactive room editing and visible window quick action"
          git push origin HEAD:fix/reference-house-room-editing
