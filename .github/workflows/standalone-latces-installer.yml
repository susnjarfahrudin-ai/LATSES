name: Standalone LAT-CES Installer Test

on:
  push:
    branches:
      - test/standalone-latces-core-gui-exe-20260827
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-standalone-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install standalone build dependencies
        shell: pwsh
        run: python -m pip install --upgrade pip numpy PyQt6 pyqtgraph reportlab pyinstaller

      - name: Correct standalone MEP verification bound
        shell: pwsh
        run: |
          $path = 'standalone_test\master_standalone.py'
          $text = Get-Content $path -Raw
          $old = 'assert 0.15 <= h1["pressure_drop_mpa"] <= 0.16'
          $new = 'assert 0.15 <= h1["pressure_drop_mpa"] <= 0.17'
          if ($text -notlike "*$old*") { throw 'Expected MEP verification assertion was not found' }
          $text = $text.Replace($old, $new)
          Set-Content -Path $path -Value $text -Encoding utf8

      - name: Verify and build standalone EXE
        shell: pwsh
        run: |
          python -m py_compile standalone_test/master_standalone.py
          python -c "import sys; sys.path.insert(0,'standalone_test'); import master_standalone as m; assert m.verify_all()"
          pyinstaller --noconfirm --clean --onefile --windowed --name LAT-CES-Standalone-Test standalone_test/master_standalone.py
          if (!(Test-Path '.\dist\LAT-CES-Standalone-Test.exe')) { throw 'Standalone EXE was not produced' }
          if ((Get-Item '.\dist\LAT-CES-Standalone-Test.exe').Length -lt 1000000) { throw 'Standalone EXE unexpectedly small' }

      - name: Smoke test standalone EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.\dist\LAT-CES-Standalone-Test.exe' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          if ($p.HasExited -and $p.ExitCode -ne 0) { throw "Standalone EXE exited with code $($p.ExitCode)" }
          if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build standalone installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path '.\installer-output-standalone' | Out-Null
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ChocolateyInstall\bin\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = Get-ChildItem 'C:\ProgramData\chocolatey\lib\innosetup' -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $iscc) { throw 'Inno Setup compiler ISCC.exe not found' }
          & $iscc 'installer\Standalone-LATCES-Test.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path '.\installer-output-standalone\LAT-CES-Standalone-Test-Setup.exe')) { throw 'Standalone installer was not produced' }
          if ((Get-Item '.\installer-output-standalone\LAT-CES-Standalone-Test-Setup.exe').Length -lt 1000000) { throw 'Standalone installer unexpectedly small' }

      - name: Smoke test standalone installer artifact
        shell: pwsh
        run: |
          $installer = '.\installer-output-standalone\LAT-CES-Standalone-Test-Setup.exe'
          Get-FileHash $installer -Algorithm SHA256 | Format-List

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: LAT-CES-Standalone-Test-EXE
          path: dist/LAT-CES-Standalone-Test.exe
          if-no-files-found: error

      - name: Upload standalone installer
        uses: actions/upload-artifact@v4
        with:
          name: LAT-CES-Standalone-Test-Installer
          path: installer-output-standalone/LAT-CES-Standalone-Test-Setup.exe
          if-no-files-found: error
