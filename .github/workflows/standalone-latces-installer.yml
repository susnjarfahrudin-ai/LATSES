name: Fahro Terenska Aplikacija - Installer

on:
  push:
    branches:
      - fahro-terenska-aplikacija
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-field-app-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26

      - name: Setup Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.10'

      - name: Install field application build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip numpy PyQt6 pyqtgraph reportlab pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compile and verify field application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile standalone_test/master_standalone.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m py_compile standalone_test/standalone_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import sys; sys.path.insert(0,'standalone_test'); import standalone_entry as e; assert e.verify_all()"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Fahro field application EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pyinstaller --noconfirm --clean --onefile --windowed --name Fahro-Terenska-Aplikacija standalone_test/standalone_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path '.\dist\Fahro-Terenska-Aplikacija.exe')) { throw 'Field application EXE not produced' }
          if ((Get-Item '.\dist\Fahro-Terenska-Aplikacija.exe').Length -lt 1000000) { throw 'Field application EXE unexpectedly small' }

      - name: Smoke test packaged field application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $p = Start-Process -FilePath '.\dist\Fahro-Terenska-Aplikacija.exe' -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          if ($p.HasExited -and $p.ExitCode -ne 0) { throw "Field application EXE exited with code $($p.ExitCode)" }
          if (!$p.HasExited) { Stop-Process -Id $p.Id -Force }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Fahro field application installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path '.\installer-output-fahro' | Out-Null
          $candidates = @(
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ChocolateyInstall\bin\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = Get-ChildItem 'C:\ProgramData\chocolatey\lib\innosetup' -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $iscc) { throw 'Inno Setup compiler ISCC.exe not found' }
          Copy-Item '.\installer\Standalone-LATCES-Test.iss' '.\installer\Fahro-Terenska-Aplikacija.iss' -Force
          & $iscc 'installer\Fahro-Terenska-Aplikacija.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path '.\installer-output-standalone\LAT-CES-Standalone-Test-Setup.exe')) { throw 'Fahro installer was not produced' }
          Move-Item '.\installer-output-standalone\LAT-CES-Standalone-Test-Setup.exe' '.\installer-output-fahro\Fahro-Terenska-Aplikacija-Setup.exe' -Force
          if ((Get-Item '.\installer-output-fahro\Fahro-Terenska-Aplikacija-Setup.exe').Length -lt 1000000) { throw 'Fahro installer unexpectedly small' }

      - name: Check installer hash
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-FileHash '.\installer-output-fahro\Fahro-Terenska-Aplikacija-Setup.exe' -Algorithm SHA256 | Format-List

      - name: Upload Fahro field application EXE
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: Fahro-Terenska-Aplikacija-Windows-x64
          path: dist/Fahro-Terenska-Aplikacija.exe
          if-no-files-found: error

      - name: Upload Fahro field application installer
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: Fahro-Terenska-Aplikacija-Installer
          path: installer-output-fahro/Fahro-Terenska-Aplikacija-Setup.exe
          if-no-files-found: error
