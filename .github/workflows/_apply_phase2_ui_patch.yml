name: Apply one-time Phase 2 UI patch

on:
  push:
    branches:
      - docs/gui-phase1b-layout-map

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal UI layout patch
        shell: python
        run: |
          from pathlib import Path

          gui_complete = Path("lat_ces/gui_complete.py")
          text = gui_complete.read_text(encoding="utf-8")
          old = '''    def _build_side_panel(self, side: ttk.Frame) -> None:\n        super()._build_side_panel(side)\n        reference_box = ttk.LabelFrame(side, text="Referentna kuća", padding=10)\n        reference_box.pack(fill="x", pady=(10, 0))\n        ttk.Label(\n            reference_box,\n            text="Ugrađena LAT-CES P+3 referentna kuća. Učitava stvarni fixture i eksplicitni gabarit/zidove.",\n            wraplength=320,\n        ).pack(anchor="w")\n        ttk.Button(\n            reference_box,\n            text="Otvori Referentnu kuću",\n            command=self.open_reference_house,\n        ).pack(fill="x", pady=(7, 0))\n'''
          new = '''    def _build_side_panel(self, side: ttk.Frame) -> None:\n        side.configure(width=320)\n        quick = ttk.LabelFrame(side, text="Brzi pristup", padding=8)\n        quick.pack(fill="x", pady=(0, 8))\n        ttk.Button(quick, text="Referentna kuća", command=self.open_reference_house).pack(fill="x")\n        draft = ttk.Frame(quick)\n        draft.pack(fill="x", pady=(6, 0))\n        for text, command in ((\"Tlocrt\", lambda: self._set_view_step(3)), (\"Zid\", self._open_wall_editor), (\"Prostorija\", lambda: self._start_payload(\"room\")), (\"Vrata\", lambda: self._start_payload(\"door\")), (\"Prozor\", lambda: self._start_payload(\"window\"))):\n            ttk.Button(draft, text=text, command=command).pack(side="left", expand=True, fill="x", padx=2)\n        super()._build_side_panel(side)\n'''
          if old not in text:
              raise SystemExit("Expected gui_complete.py side-panel block not found")
          gui_complete.write_text(text.replace(old, new, 1), encoding="utf-8")

          gui = Path("lat_ces/gui.py")
          gui_text = gui.read_text(encoding="utf-8")
          old_gui = '        side = ttk.Frame(body, width=360)\n'
          new_gui = '        side = ttk.Frame(body, width=320)\n'
          if old_gui not in gui_text:
              raise SystemExit("Expected gui.py sidebar width not found")
          gui.write_text(gui_text.replace(old_gui, new_gui, 1), encoding="utf-8")
      - name: Commit patched source and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/_apply_phase2_ui_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lat_ces/gui_complete.py lat_ces/gui.py
          git add -u .github/workflows/_apply_phase2_ui_patch.yml
          git commit -m "feat(gui): simplify sidebar and expose drafting actions" \
            -m "Keep gui_complete.py as the production entrypoint while moving Reference House and common drafting actions into the visible top area. Reduce the fixed sidebar width to give the canonical Canvas more space."
          git push