[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lat-ses-agent"
version = "0.1.0"
description = "A minimal agent scaffold for the LATSES repository"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
lat-ces = "lat_ces.cli:main"
lat-ces-gui = "lat_ces.gui_complete:main"
lat-ces-gui-legacy = "lat_ces.gui_drafting:main"
lat-ces-gui-mep = "lat_ces.gui_mep:main"
lat-ces-gui-water = "lat_ces.gui_water:main"
lat-ces-gui-heating = "lat_ces.gui_heating:main"
lat-ces-gui-mep-workspace = "lat_ces.gui_mep_workspace:main"
lat-ces-gui-mep-engineering = "lat_ces.gui_mep_engineering:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lat_ces*", "lat_ses*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
